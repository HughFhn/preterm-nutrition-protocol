<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPN Protocol Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <h1>SPN Protocol Calculator</h1>
            <p class="subtitle">Calculate Supplemental Parenteral Nutrition targets for neonatal patients</p>
            
            <div class="info-box">
                <p><strong>Protocol Selection:</strong></p>
                <p>• PN Phase: EN Volume < 40 mL</p>
                <p>• TN Phase: EN Volume ≥ 40 mL and Day of Life ≥ 2</p>
            </div>
            
            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST">
                <div class="form-group">
                    <label for="en_vol">Enteral Nutrition Volume (mL)</label>
                    <input type="number" id="en_vol" name="en_vol" required min="0" max="120" step="1" placeholder="Enter EN volume (0-120)">
                </div>
                
                <div class="form-group">
                    <label for="dol">Day of Life</label>
                    <input type="number" id="dol" name="dol" required min="1" step="1" placeholder="Enter day of life">
                </div>
                
                <div class="form-group">
                    <label for="weight">Patient Weight (kg)</label>
                    <input type="number" id="weight" name="weight" required min="0.1" step="0.01" placeholder="Enter weight in kg">
                </div>
                
                <button type="submit" class="button">Calculate Protocol</button>
            </form>
        </div>
        
        <div class="output">
        {% if output %}
        <div class="card">
            <div class="output-card">
                <div class="output-title">Protocol Results</div>
                <pre>{{ output }}</pre>
            </div>
        </div>
        {% endif %}
        </div>
    </div>
</body>
</html>
