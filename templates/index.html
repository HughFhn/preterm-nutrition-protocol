<!doctype html>
<html>
<head>
    <title>Preterm Nutrition Protocol</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Calculate Protocol</h1>
        <form method="POST">
            <label>EN Volume (mL):</label>
            <input type="number" name="en_vol" step="0.1" required><br><br>

            <label>DOL:</label>
            <input type="number" name="dol" step="0.1" required><br><br>

            <label>Weight (kg):</label>
            <input type="number" name="weight" step="0.01" required><br><br>

            <button type="submit">Calculate</button>
        </form>

        {% if output %}
            <h2>Result:</h2>
            <pre>{{ output }}</pre>
        {% endif %}
    </div>
</body>
</html>
